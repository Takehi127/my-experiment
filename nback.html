       フルティガーエアロ・テーマスタイル
       ========================================================================= */

      --bg-gradient-top: #bae6fd;  /* スカイブルー */
      --bg-gradient-mid: #38bdf8;  /* アクアブルー */
      --bg-gradient-bot: #4ade80;  /* フレッシュグリーン */

    body {
      font-family: 'Comfortaa', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
      /* 明るい太陽光と自然、水の流れを感じるグラデーション背景 */
      background: radial-gradient(circle at 50% 0%, #f0fdf4 0%, #e0f2fe 35%, #bae6fd 70%, #4ade80 140%);
      color: #0f172a;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* jsPsych の表示領域を全体に美しく、透明感のあるレイアウトとして構築 */
    .jspsych-display-element {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
      z-index: 10;
      position: relative;
    }

    /* ガラスモルフィズム: Windows Aeroガラスのような透明感、光沢、立体感 */
    .aero-glass-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(18px) saturate(200%);
      -webkit-backdrop-filter: blur(18px) saturate(200%);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 2rem;
      box-shadow: 
        0 15px 35px rgba(2, 132, 199, 0.15),
        inset 0 4px 12px rgba(255, 255, 255, 0.7),
        inset 0 -4px 10px rgba(56, 189, 248, 0.2);
      max-width: 680px;
      width: 100%;
      padding: 2.5rem;
      text-align: left;
      position: relative;
      overflow: hidden;
    }

    /* ガラスのハイライト（光沢グロスエフェクト） */
    .aero-glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.05) 100%);
      border-radius: 1.8rem 1.8rem 0 0;
      pointer-events: none;
    }

    /* 水彩的なオーラ・流線形の光沢パス */
    .aero-streamline {
      position: absolute;
      width: 200%;
      height: 150px;
      background: linear-gradient(90deg, rgba(56, 189, 248, 0) 0%, rgba(56, 189, 248, 0.25) 50%, rgba(74, 222, 128, 0.25) 80%, rgba(255,255,255,0) 100%);
      transform: rotate(-12deg) translateY(-80px);
      filter: blur(10px);
      pointer-events: none;
      animation: driftWaves 15s linear infinite;
    }

    @keyframes driftWaves {
      0% { transform: rotate(-12deg) translate(-50%, -80px); }
      100% { transform: rotate(-12deg) translate(0%, -80px); }
    }

    /* 押しやすい2000年代風のアクア・バブルボタン */
    .jspsych-btn {
      display: inline-block;
      padding: 0.9rem 2.5rem !important;
      font-size: 1.15rem !important;
      font-weight: 700 !important;
      border-radius: 9999px !important;
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 45%, #0369a1 100%) !important;
      color: white !important;
      border: 2px solid rgba(255, 255, 255, 0.5) !important;
      box-shadow: 
        0 6px 15px rgba(2, 132, 199, 0.35),
        inset 0 4px 6px rgba(255, 255, 255, 0.5) !important;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) !important;
      cursor: pointer;
      margin: 0.5rem !important;
      position: relative;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .jspsych-btn::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 10%;
      right: 10%;
      height: 35%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.7) 0%, rgba(255, 255, 255, 0) 100%);
      border-radius: 9999px;
    }

    .jspsych-btn:hover {
      background: linear-gradient(180deg, #0ea5e9 0%, #0284c7 45%, #075985 100%) !important;
      transform: translateY(-2px) scale(1.02);
      box-shadow: 
        0 8px 20px rgba(2, 132, 199, 0.5),
        inset 0 4px 6px rgba(255, 255, 255, 0.6) !important;
    }

    .jspsych-btn:active {
      transform: translateY(1px);
    }

    /* 課題用レイアウトコンテナ */

      flex-direction: column;
      align-items: center;
      justify-content: space-between;

    /* 流線形のオーラ帯でできたガイド */

      text-shadow: 0 1px 0 rgba(255,255,255,0.8);
    }

    /* 刺激アルファベットを表示する「3D光沢バブル」 */
    .stimulus-bubble {

      background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.95) 0%, rgba(186, 230, 253, 0.5) 45%, rgba(56, 189, 248, 0.35) 70%, rgba(14, 165, 233, 0.65) 100%);

    @keyframes floatUp {

      90% { opacity: 0.7; }

    @keyframes swimHorizontal {

      50% {

    /* 水中をゆらゆらと舞い降りる・浮かぶ四つ葉のクローバー */
    .aero-clover {

  <!-- jsPsych の注入先ターゲット -->
  <div id="jspsych-target"></div>

  <script>
    // =========================================================================
    // 1. N-Back配列生成アルゴリズム (厳密にターゲットを6回含む20試行分を生成)
    // =========================================================================
    
    // --- 1-Back用の系列生成 ---
    function generate1BackSequence() {
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const totalTrials = 20;
      const targetCount = 6; 

      let sequence = [];
      let isTargetArray = new Array(totalTrials).fill(false);

      // 1試行目は絶対にターゲットにできない（直前が存在しないため）
      let targetIndices = [];
      while (targetIndices.length < targetCount) {
        let randIdx = Math.floor(Math.random() * (totalTrials - 1)) + 1; // 1 to 19
        if (!targetIndices.includes(randIdx)) {
          targetIndices.push(randIdx);
        }
      }
      
      targetIndices.forEach(idx => {
        isTargetArray[idx] = true;
      });

      // 最初の文字を決定
      sequence.push(letters[Math.floor(Math.random() * letters.length)]);

      // 2試行目以降を構築
      for (let i = 1; i < totalTrials; i++) {
        let prevLetter = sequence[i - 1];

        if (isTargetArray[i]) {
          // ターゲット試行：直前の文字と同じにする
          sequence.push(prevLetter);
        } else {
          // 非ターゲット試行：直前とは必ず違う文字にする
          let possibleLetters = letters.filter(l => l !== prevLetter);
          let chosen = possibleLetters[Math.floor(Math.random() * possibleLetters.length)];
          sequence.push(chosen);
        }
      }

      return sequence.map((letter, index) => {
        let isTarget = false;
        if (index > 0 && sequence[index] === sequence[index - 1]) {
          isTarget = true;
        }
        return {
          trial_index: index + 1,
          letter: letter,
          is_target: isTarget
        };
      });
    }

    // --- 2-Back用の系列生成 (厳密に6ターゲット) ---
    function generate2BackSequence() {
      const letters = ['A', 'B', 'C', 'D', 'E'];
      const totalTrials = 20;
      const targetCount = 6;

      let sequence = [];
      let isTargetArray = new Array(totalTrials).fill(false);

      // 1, 2試行目は絶対にターゲットにできない（2つ前が存在しないため）
      let targetIndices = [];
      while (targetIndices.length < targetCount) {
        let randIdx = Math.floor(Math.random() * (totalTrials - 2)) + 2; // 2 to 19
        if (!targetIndices.includes(randIdx)) {
          targetIndices.push(randIdx);
        }
      }

      targetIndices.forEach(idx => {
        isTargetArray[idx] = true;
      });

      // 最初の2文字はランダムに選択
      sequence.push(letters[Math.floor(Math.random() * letters.length)]);
      sequence.push(letters[Math.floor(Math.random() * letters.length)]);

        let targetLetter = sequence[i - 2]; // 2つ前の文字

        if (isTargetArray[i]) {
          // ターゲット試行：2つ前の文字と同じにする
          sequence.push(targetLetter);
        } else {
          // 非ターゲット試行：2つ前の文字とは必ず違う文字にする
          let possibleLetters = letters.filter(l => l !== targetLetter);
          let chosen = possibleLetters[Math.floor(Math.random() * possibleLetters.length)];
          sequence.push(chosen);
        }
      }

      return sequence.map((letter, index) => {
        let isTarget = false;
        if (index >= 2 && sequence[index] === sequence[index - 2]) {
          isTarget = true;
        }
        return {
          trial_index: index + 1,
          letter: letter,

      const displayEl = jsPsych.getDisplayElement();
      const allTrials = jsPsych.data.get().filter({trial_type: 'html-keyboard-response'}).values();
      
      // 条件別に抽出
      const trials1Back = allTrials.filter(d => d.condition === '1-back');
      const trials2Back = allTrials.filter(d => d.condition === '2-back');

      // 1-Back 正答率
      const count1B = trials1Back.length;
      const correct1B = trials1Back.filter(d => d.correct === true).length;
      const accuracy1B = count1B > 0 ? Math.round((correct1B / count1B) * 100) : 0;
      const validRts1B = trials1Back.filter(d => typeof d.custom_rt === 'number').map(d => d.custom_rt);
      const avgRt1B = validRts1B.length > 0 ? Math.round(validRts1B.reduce((a, b) => a + b, 0) / validRts1B.length) : '-';

      // 2-Back 正答率
      const count2B = trials2Back.length;
      const correct2B = trials2Back.filter(d => d.correct === true).length;
      const accuracy2B = count2B > 0 ? Math.round((correct2B / count2B) * 100) : 0;
      const validRts2B = trials2Back.filter(d => typeof d.custom_rt === 'number').map(d => d.custom_rt);
      const avgRt2B = validRts2B.length > 0 ? Math.round(validRts2B.reduce((a, b) => a + b, 0) / validRts2B.length) : '-';

      // 1つのテーブルへマージ
      let tableRows = '';
      allTrials.forEach((row) => {
        const correctBadge = row.correct 
          ? '<span class="badge-correct">正解</span>' 
          : '<span class="badge-incorrect">不正解</span>';

        const condBadge = row.condition === '1-back' 
          ? '<span class="badge-condition-1b">1-Back</span>' 
          : '<span class="badge-condition-2b">2-Back</span>';

        let targetCondition = '';
        if (row.condition === '1-back') {
          if (row.custom_trial_index === 1) {
            targetCondition = '<span class="badge-nontarget">最初 (違う)</span>';
          } else {
            targetCondition = row.custom_is_target 
              ? '<span class="badge-target">同じ (Target)</span>' 
              : '<span class="badge-nontarget">違う</span>';
          }
        } else {
          if (row.custom_trial_index <= 2) {
            targetCondition = '<span class="badge-nontarget">最初 (違う)</span>';
          } else {
            targetCondition = row.custom_is_target 
              ? '<span class="badge-target">同じ (Target)</span>' 
              : '<span class="badge-nontarget">違う</span>';
          }
        }

        tableRows += `
          <tr class="hover:bg-white/30 transition-colors">
            <td class="py-2.5">${condBadge}</td>
            <td class="font-bold text-sky-800">${row.custom_trial_index}</td>
            <td class="text-2xl font-black text-sky-600">${row.custom_letter}</td>
            <td>${targetCondition}</td>
            <td class="font-extrabold text-sky-900">${row.custom_answer}</td>
            <td>${correctBadge}</td>
            <td class="font-bold text-sky-900">${row.custom_rt} ${typeof row.custom_rt === 'number' ? 'ms' : ''}</td>
          </tr>
        `;
      });

      // 送信結果に応じたステータスバナーの表示
      const statusBanner = isSuccess 
        ? `<div class="bg-emerald-500/10 border border-emerald-400 text-emerald-800 text-sm font-extrabold px-4 py-3 rounded-xl mb-6">
             ✅ データ送信完了: クラウド上に実験データが安全に記録されました。ご協力に深く感謝いたします。
           </div>`
        : `<div class="bg-amber-500/10 border border-amber-400 text-amber-800 text-sm font-extrabold px-4 py-3 rounded-xl mb-6">
             ⚠️ オフライン保存完了: 今回の結果はローカルメモリに正常にバインドされました。
           </div>`;

      // ダッシュボード風リザルト
      displayEl.innerHTML = `
        <div class="max-w-4xl w-full my-8 mx-auto px-4 z-20">
          <div class="aero-glass-card shadow-2xl p-6 md:p-10 text-center">
            <div class="aero-streamline"></div>
            
            <h1 class="text-4xl font-black text-sky-800 mb-2 drop-shadow-sm">実験終了。ご協力ありがとうございました。</h1>
            <p class="text-sky-900/80 font-bold mb-6 text-sm">あなたの貴重な実験反応データは全て記録され、集計が完了いたしました。</p>
            
            ${statusBanner}

            <!-- 被験者基本情報 -->
            <div class="bg-white/40 border border-white/60 p-4 rounded-2xl shadow-inner text-left mb-6">
              <h3 class="font-black text-sky-800 flex items-center gap-1 text-sm border-b border-white/60 pb-1.5 mb-2">
                👤 参加者情報
              </h3>
              <div class="flex flex-wrap gap-x-8 gap-y-1 text-sm text-sky-900 font-bold">
                <p><strong>参加者ID:</strong> ${participantInfo.id}</p>
                <p><strong>年齢:</strong> ${participantInfo.age} 歳</p>
                <p><strong>性別:</strong> ${participantInfo.gender}</p>
              </div>
            </div>

            <!-- パフォーマンス比較サマリー -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 text-left">
              
              <!-- 1-Back サマリー -->
              <div class="bg-gradient-to-br from-white/60 to-sky-100/40 border border-white/60 p-5 rounded-2xl shadow-inner">
                <h3 class="font-black text-sky-800 border-b border-white/60 pb-2 mb-3 flex items-center gap-1.5">
                  <span class="inline-block w-2.5 h-4 bg-sky-500 rounded-full"></span>
                  前半：1-Back セッション
                </h3>
                <div class="grid grid-cols-2 gap-4 text-center mt-2">
                  <div>
                    <span class="block text-xs text-sky-600 font-extrabold uppercase">正答率</span>
                    <span class="text-3xl font-black text-sky-700">${accuracy1B}%</span>
                    <span class="text-xs block text-sky-500">(${correct1B} / ${count1B} 試行)</span>
                  </div>
                  <div>
                    <span class="block text-xs text-sky-600 font-extrabold uppercase">平均反応時間</span>
                    <span class="text-3xl font-black text-sky-700">${avgRt1B} <span class="text-sm font-normal">ms</span></span>
                  </div>
                </div>
              </div>
              
              <!-- 2-Back サマリー -->
              <div class="bg-gradient-to-br from-white/60 to-emerald-100/40 border border-white/60 p-5 rounded-2xl shadow-inner">
                <h3 class="font-black text-emerald-800 border-b border-white/60 pb-2 mb-3 flex items-center gap-1.5">
                  <span class="inline-block w-2.5 h-4 bg-emerald-500 rounded-full"></span>
                  後半：2-Back セッション
                </h3>
                <div class="grid grid-cols-2 gap-4 text-center mt-2">
                  <div>
                    <span class="block text-xs text-emerald-600 font-extrabold uppercase">正答率</span>
                    <span class="text-3xl font-black text-emerald-700">${accuracy2B}%</span>
                    <span class="text-xs block text-emerald-600">(${correct2B} / ${count2B} 試行)</span>
                  </div>
                  <div>
                    <span class="block text-xs text-emerald-600 font-extrabold uppercase">平均反応時間</span>
                    <span class="text-3xl font-black text-emerald-700">${avgRt2B} <span class="text-sm font-normal">ms</span></span>
                  </div>
                </div>
              </div>

            </div>

            <!-- 統合詳細テーブル -->
            <h3 class="text-xl font-black text-sky-800 mb-3 flex items-center justify-start">
              <span class="inline-block w-3.5 h-6 bg-gradient-to-b from-sky-400 to-sky-600 rounded-full mr-2 shadow"></span>
              全試行統合 詳細データ一覧
            </h3>
            
            <div class="overflow-x-auto border border-white/50 rounded-2xl shadow-sm bg-white/10 backdrop-blur-md max-h-[450px] overflow-y-auto">
              <table class="result-table">
                <thead class="sticky top-0 z-30">
                  <tr>
                    <th>条件 (Condition)</th>
                    <th>試行</th>
                    <th>提示</th>
                    <th>ターゲット条件</th>
                    <th>回答</th>
                    <th>判定</th>
                    <th>反応時間</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRows}
                </tbody>
              </table>
            </div>

            <div class="mt-8 text-center">
              <button onclick="window.location.reload();" class="jspsych-btn focus:outline-none">
                もう一度最初から挑戦する
              </button>
            </div>
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 5. 実行開始
    // =========================================================================
    jsPsych.run(timeline);
  </script>
</body>
</html>
